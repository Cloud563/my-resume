<div class="resume-container">
  <app-header
    (scrollToExperience)="scrollTo('experienceSection')"
    (openTelegram)="openTelegram()"
    (openMap)="openMap()"
  >
  </app-header>

  <main class="main-content">
    <div class="grid-layout">
      <div class="left-column">
        <app-description [description]="description" (scrollToSection)="scrollTo($event)"> </app-description>
        <app-position (scrollToSection)="scrollTo($event)"></app-position>
        <app-skills [skillsCategories]="skillsCategories" (scrollToSection)="scrollTo($event)"> </app-skills>
      </div>

      <div class="right-column">
        <app-experience [experiences]="experiences" (scrollToSection)="scrollTo($event)"> </app-experience>
        <app-education (scrollToSection)="scrollTo($event)"></app-education>
      </div>
    </div>
  </main>

  <app-footer></app-footer>
</div>
